name: Deploy React App

on:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 28101
          script: |
            cd /opt/JagaKota-FE
            git pull origin DEV
            echo "Writing .env file"
            cat <<EOF > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            docker build -t JagaKota-FE .
            docker stop JagaKota-FE_container || true
            docker rm JagaKota-FE_container || true
            docker run -d --name JagaKota-FE_container -p 4000:80 JagaKota-FE
